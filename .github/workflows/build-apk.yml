name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug

      - name: Find and prepare APK
        run: |
          APK_PATH=$(find . -name "app-debug.apk" | head -n 1)
          echo "APK encontrado en: $APK_PATH"
          mkdir -p /tmp/output
          cp "$APK_PATH" /tmp/output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: /tmp/output/app-debug.apk

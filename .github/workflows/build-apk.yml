name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find project directory
        id: find
        run: |
          GRADLEW_PATH=$(find . -maxdepth 2 -name "gradlew" | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Encontrado en: $PROJECT_DIR"

      - name: Grant execute permission for gradlew
        run: chmod +x "${{ steps.find.outputs.dir }}/gradlew"

      - name: Build APK
        run: cd "${{ steps.find.outputs.dir }}" && ./gradlew assembleDebug

      - name: Find and upload APK
        run: |
          APK_PATH=$(find . -name "app-debug.apk" | head -n 1)
          echo "APK encontrado en: $APK_PATH"
          mkdir -p /tmp/output
          cp "$APK_PATH" /tmp/output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: /tmp/output/app-debug.apk

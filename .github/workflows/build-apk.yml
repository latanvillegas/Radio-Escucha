name: Android CI and signed releases

on:
  push:
    branches: [main, 'release/v*.*.*']
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build debug APK for CI only
        run: gradle :app:assembleDebug --no-daemon
      - name: Validate minified release build without publishing
        run: gradle :app:assembleRelease --no-daemon
      - name: Upload debug CI artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: openradio-debug-ci
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Sign and publish production APK
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v'))
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate release tag and derive Android version
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="${GITHUB_REF_NAME##*/}"
          if [[ ! "$RELEASE_TAG" =~ ^v([1-9][0-9]{0,2})\.([0-9]|[1-9][0-9]{0,2})\.([0-9]|[1-9][0-9]{0,2})$ ]]; then
            echo "::error::Release tags must match vMAJOR.MINOR.PATCH (each component 0..999, MAJOR > 0)"
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          version_code=$((major * 1000000 + minor * 1000 + patch))
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          if [[ ! -f "fastlane/metadata/android/en-US/changelogs/$version_code.txt" ]]; then
            echo "::error::Missing matching Fastlane changelog for versionCode=$version_code"
            exit 1
          fi
          for locale in en-US es-ES; do
            test -s "fastlane/metadata/android/$locale/images/icon.png" || {
              echo "::error::Missing store icon for $locale"
              exit 1
            }
          done
          for i in 1 2 3 4 5; do
            test -s "fastlane/metadata/android/es-ES/images/phoneScreenshots/$i.jpg" || {
              echo "::error::Missing screenshot $i.jpg"
              exit 1
            }
          done
      - name: Restore permanent production signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Required signing secret is missing: $variable"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openradio-release.jks"
          test -s "$RUNNER_TEMP/openradio-release.jks"
      - name: Build signed production APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/openradio-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease \
            -PAPP_VERSION_NAME="$APP_VERSION_NAME" \
            -PAPP_VERSION_CODE="$APP_VERSION_CODE" --no-daemon
      - name: Verify signature and prepare published assets
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$signer"
          "$signer" verify --verbose --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/OpenRadio-$RELEASE_TAG.apk"
          (cd dist && sha256sum "OpenRadio-$RELEASE_TAG.apk" > "OpenRadio-$RELEASE_TAG.apk.sha256")
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/OpenRadio-*.apk
            dist/OpenRadio-*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true

name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Find and prepare APK
        run: |
          APK_PATH=$(find . -name "app-debug.apk" | head -n 1)
          mkdir -p /tmp/output
          cp "$APK_PATH" /tmp/output/app-debug.apk

      - name: Upload APK (artifact, temporal)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: /tmp/output/app-debug.apk
          retention-days: 90

      - name: Create GitHub Release (permanente)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "OpenRadio Build #${{ github.run_number }}"
          files: /tmp/output/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

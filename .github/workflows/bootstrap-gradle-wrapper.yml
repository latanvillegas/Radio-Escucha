name: Bootstrap official Gradle 8.9 Wrapper (temporary)
on:
  push:
    branches: [docs/readme-and-gradle-wrapper]
    paths:
      - '.github/workflows/bootstrap-gradle-wrapper.yml'
permissions:
  contents: write
jobs:
  generate-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/readme-and-gradle-wrapper
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate official Wrapper from installed Gradle
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin --no-daemon
          fi
          test -s gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradlew
          test -f gradlew.bat
          chmod +x gradlew
          ./gradlew --version --no-daemon
      - name: Commit generated wrapper files to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Wrapper already versioned"
            exit 0
          fi
          git commit -m "build(gradle): add official Gradle 8.9 Wrapper"
          git push origin HEAD:docs/readme-and-gradle-wrapper
